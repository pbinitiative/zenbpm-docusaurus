name: version docs

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version with v prefix, for example v2.0.0.
        required: true
        type: string
      backend_tag:
        description: Backend tag to read docs artifacts from, for example v2.0.0.
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: docs-versioning
  cancel-in-progress: false

jobs:
  version-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tags
        env:
          BACKEND_TAG: ${{ inputs.backend_tag }}
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          release_pattern='^v[0-9]+\.[0-9]+\.[0-9]+$'
          if [[ ! "$RELEASE_TAG" =~ $release_pattern ]]; then
            echo "Version must be vX.Y.Z" >&2
            exit 1
          fi
          if [[ ! "$BACKEND_TAG" =~ $release_pattern ]]; then
            echo "Backend tag must be vX.Y.Z" >&2
            exit 1
          fi
          if [ "$BACKEND_TAG" != "$RELEASE_TAG" ]; then
            echo "Backend tag $BACKEND_TAG must match release tag $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Resolve docs release state
        id: release-state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          if gh api -H "Accept: application/vnd.github+json" "/repos/pbinitiative/zenbpm-docusaurus/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists; reusing it for Pages deployment."
            echo "tag-exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag-exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release app token
        id: release-app-token
        if: ${{ steps.release-state.outputs.tag-exists != 'true' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID_ZENBPM_RELEASE }}
          private-key: ${{ secrets.APP_PRIVATE_KEY_ZENBPM_RELEASE  }}
          owner: pbinitiative
          repositories: |
            zenbpm
          permission-contents: read

      - name: Checkout docs
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        if: ${{ steps.release-state.outputs.tag-exists != 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '21'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        if: ${{ steps.release-state.outputs.tag-exists != 'true' }}
        run: npm install

      - name: Download versioned source artifacts
        if: ${{ steps.release-state.outputs.tag-exists != 'true' }}
        env:
          BACKEND_TAG: ${{ inputs.backend_tag }}
          GH_TOKEN: ${{ steps.release-app-token.outputs.token }}
        run: |
          gh api "/repos/pbinitiative/zenbpm/contents/openapi/api.yaml?ref=${BACKEND_TAG}" --jq .content \
            | base64 -d > openapi/redocusaurus/api.yaml
          gh api "/repos/pbinitiative/zenbpm/contents/pkg/zenclient/proto/zenbpm.proto?ref=${BACKEND_TAG}" --jq .content \
            | base64 -d > proto/zenbpm.proto

      - name: Create docs version
        if: ${{ steps.release-state.outputs.tag-exists != 'true' }}
        env:
          RELEASE_TAG: ${{ inputs.version }}
        run: npm run version -- "$RELEASE_TAG"

      - name: Build documentation
        if: ${{ steps.release-state.outputs.tag-exists != 'true' }}
        env:
          BASE_URL: /
          SITE_URL: https://zenbpm.pbinitiative.org
        run: npm run build

      - name: Commit, tag, and push docs version
        if: ${{ steps.release-state.outputs.tag-exists != 'true' }}
        env:
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          git config user.name "zenbpm-release-bot"
          git config user.email "zenbpm-release-bot@users.noreply.github.com"
          git add docs openapi proto versioned_docs versioned_sidebars versions.json
          if git diff --cached --quiet; then
            echo "No docs release changes to commit."
          else
            git commit -m "docs: version $RELEASE_TAG"
          fi
          git tag "$RELEASE_TAG"
          git push origin HEAD:main "$RELEASE_TAG"

  deploy-docs:
    needs: version-docs
    uses: ./.github/workflows/docs.yml
    with:
      checkout_ref: ${{ inputs.version }}
    secrets: inherit
